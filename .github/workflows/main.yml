name: Build Android AAB

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract Bolt project
        run: |
          mkdir -p project
          unzip -q "Daily Rewards App - Bolt.new (4)" -d project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies and sync Capacitor
        working-directory: project
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/project" -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$ANDROID_DIR" ]; then
            echo "gradlew not found"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build signed release AAB
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daily-rewards-release-aab
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
