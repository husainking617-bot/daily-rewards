name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor Android wrapper
        run: |
          set -euxo pipefail
          mkdir project
          cd project
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install @capacitor-community/admob@7.0.3
          npm install -D @capacitor/cli@7
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="UTF-8"><title>Daily Rewards</title></head>
          <body><p>Loading Daily Rewards...</p></body></html>
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dailyrewards.app",
            "appName": "Daily Rewards",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/assets
          cp $GITHUB_WORKSPACE/admob-bridge.js android/app/src/main/assets/admob-bridge.js
          mkdir -p android/app/src/main/java/com/dailyrewards/app
          cp $GITHUB_WORKSPACE/MainActivity.java android/app/src/main/java/com/dailyrewards/app/MainActivity.java

      - name: Add Google Mobile Ads dependency
        working-directory: project/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          dep = '    implementation "com.google.android.gms:play-services-ads:24.7.0"\n'
          if "play-services-ads" not in s:
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n" + dep, 1)
              else:
                  s += "\ndependencies {\n" + dep + "}\n"
          p.write_text(s)
          PY

      - name: Configure AdMob
        working-directory: project/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m = Path("app/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              s = s.replace("</application>", '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />\n    </application>')
          m.write_text(s)
          v = Path("app/src/main/res/values/strings.xml")
          s = v.read_text()
          if "admob_app_id" not in s:
              s = s.replace("</resources>", '    <string name="admob_app_id">ca-app-pub-8752731937658252~8914132798</string>\n</resources>')
          v.write_text(s)
          PY

      - name: Configure release signing
        working-directory: project/android
        run: |
          set -euxo pipefail
          cp ../../daily-rewards-release.jks ./daily-rewards-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "android {"
          insert = """android {
              signingConfigs {
                  release {
                      storeFile file("../daily-rewards-release.jks")
                      storePassword "dailyrewards"
                      keyAlias "dailyrewards"
                      keyPassword "dailyrewards"
                  }
              }
          """
          if marker not in s:
              raise SystemExit("android block not found")
          s = s.replace(marker, insert, 1)
          if "signingConfig signingConfigs.release" not in s:
              s = s.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }", 1)
          p.write_text(s)
          PY

      - name: Build release APK and AAB
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-rewards-release-apk
          path: project/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daily-rewards-release-aab
          path: project/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
