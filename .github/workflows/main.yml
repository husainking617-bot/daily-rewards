name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor Android wrapper
        run: |
          set -euxo pipefail
          mkdir project
          cd project
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7 typescript
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="UTF-8"><title>Daily Rewards</title></head>
          <body><p>Loading Daily Rewards...</p></body></html>
          EOF
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.dailyrewards.app',
            appName: 'Daily Rewards',
            webDir: 'www',
            server: {
              url: 'https://daily-rewards-app-y45t.bolt.host',
              cleartext: false
            }
          };

          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure release signing
        working-directory: project/android
        run: |
          set -euxo pipefail
          keytool -genkeypair -v -keystore daily-rewards-release.jks -storepass dailyrewards -keypass dailyrewards -alias dailyrewards -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Daily Rewards"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "android {"
          insert = """android {
              signingConfigs {
                  release {
                      storeFile file("../daily-rewards-release.jks")
                      storePassword "dailyrewards"
                      keyAlias "dailyrewards"
                      keyPassword "dailyrewards"
                  }
              }
          """
          if marker not in s:
              raise SystemExit("android block not found")
          s = s.replace(marker, insert, 1)
          s = s.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }", 1)
          p.write_text(s)
          PY

      - name: Build release AAB
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daily-rewards-release-aab
          path: project/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
