name: Build Project 2 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'project2/**'
      - '.github/workflows/project2-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: project2
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-recovery-apk
          path: project2/app/build/outputs/apk/debug/app-debug.apk
