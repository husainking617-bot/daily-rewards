name: Build Project 2 v2 APK
on:
  push:
    branches: [main]
    paths: ['project2/**','.github/workflows/project2-v2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -L -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip && unzip -q /tmp/g.zip -d /tmp
      - run: /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: project2-v2-recovery-apk
          path: project2/app/build/outputs/apk/debug/app-debug.apk
